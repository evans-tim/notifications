<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <title>Daily Reminder</title>
  </head>
  <body>
    <main>
      <p>Eat protein and work on my cursor clone</p>
      <button id="enable-reminder" type="button">Enable reminder</button>
      <p id="permission-result"></p>
    </main>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js");
      }

      document.getElementById("enable-reminder").addEventListener("click", async () => {
        const result = await Notification.requestPermission();
        document.getElementById("permission-result").textContent = result;
      });
    </script>
  </body>
</html>
