<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <title>Daily Reminder</title>
  </head>
  <body>
    <main>
      <p>Eat protein and work on my cursor clone</p>
      <button id="enable-reminder" type="button">Enable reminder</button>
      <p id="permission-result"></p>
      <pre id="subscription-result"></pre>
    </main>
    <script>
      const VAPID_PUBLIC_KEY = "BKxVWSDwvxrUqfzGTGTh43XV52qB237XZpLH3vcIge_7JgkgSl1VBLiHc8oGWzP7YRdroPKN8pybc_y6lU4-OsQ";
      const urlBase64ToUint8Array = (base64String) => {
        const padding = "=".repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
        const rawData = window.atob(base64);
        return Uint8Array.from([...rawData].map((char) => char.charCodeAt(0)));
      };

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js");
      }

      document.getElementById("enable-reminder").addEventListener("click", async () => {
        const result = await Notification.requestPermission();
        document.getElementById("permission-result").textContent = result;

        if (result !== "granted") {
          return;
        }

        const registration = await navigator.serviceWorker.ready;
        const subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
        });
        document.getElementById("subscription-result").textContent = JSON.stringify(subscription, null, 2);
      });
    </script>
  </body>
</html>
